[project]
name = "domestique"
version = "0.1.0"
description = "Personal agentic cycling coach — grounded in one athlete's training data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.scripts]
domestique = "domestique.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domestique"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
